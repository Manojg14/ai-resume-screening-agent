<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="AI Resume Screening Agent - Intelligent NLP based recruitment system"
    >

    <title>
        {% block title %}
        AI Resume Screening Agent
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <!-- ============================= -->
    <!-- NAVBAR -->
    <!-- ============================= -->

    <header class="navbar">

        <div class="nav-container">

            <a
                href="{{ url_for('index') }}"
                class="brand"
            >

                <div class="brand-icon">
                    AI
                </div>

                <div class="brand-text">

                    <strong>
                        ResumeAI
                    </strong>

                    <span>
                        Intelligent Screening
                    </span>

                </div>

            </a>


            <div class="nav-status">

                <span class="status-dot"></span>

                AI Engine Online

            </div>

        </div>

    </header>


    <!-- ============================= -->
    <!-- FLASH MESSAGES -->
    <!-- ============================= -->

    <main class="main-container">

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="alert">

                        <span class="alert-icon">
                            !
                        </span>

                        <span>
                            {{ message }}
                        </span>

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        {% block content %}

        {% endblock %}

    </main>


    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->

    <footer class="footer">

        <div class="footer-content">

            <div>

                <strong>
                    ResumeAI
                </strong>

                <span>
                    AI-powered recruitment intelligence
                </span>

            </div>

            <p>
                Flask + NLP
            </p>

        </div>

    </footer>


</body>

</html>
